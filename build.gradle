plugins {
    id 'java'
}

group = 'com.example'
// Single source of truth: read version from manifest.json so we only bump in one place.
version = new groovy.json.JsonSlurper().parse(file('src/main/resources/manifest.json')).Version
description = 'EndlessLevelingTemplate'

// Update 6: the install is selected by -Ppatchline (default pre-release). The old
// `hytaleInstallPath` property is deliberately NOT consulted here: a machine-wide value in
// ~/.gradle/gradle.properties silently pinned every local build to the 0.5.9 release jar,
// which compiles clean and then fails at runtime on the new protocol.
def patchline = providers.gradleProperty('patchline').orElse('pre-release').get()
def hytaleHome = {
    def userHome = System.getProperty('user.home')
    def osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('win')) {
        def appData = System.getenv('APPDATA') ?: "${userHome}/AppData/Roaming"
        return "${appData}/Hytale"
    }
    if (osName.contains('mac')) {
        return "${userHome}/Library/Application Support/Hytale"
    }
    def flatpak = "${userHome}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
    return new File(flatpak).exists() ? flatpak : "${userHome}/.local/share/Hytale"
}()
def hytaleInstallPath = providers.provider { "${hytaleHome}/install/${patchline}/package/game/latest" }

repositories {
    mavenCentral()
}

dependencies {
    // Compile against the local server API without bundling it into the addon jar.
    compileOnly files("${hytaleInstallPath.get()}/Server/HytaleServer.jar")
    // Compile against Endless Leveling classes from the sibling project's build output.
    // Two candidate directory names are accepted: 'endlessleveling' is the symlink the
    // partner/template layout uses, and 'Endless-Leveling-Core' is the real directory name in
    // the Endless workspace. Gradle's files() silently drops entries that do not exist, so
    // listing both resolves in either layout instead of depending on an untracked symlink
    // being present (its absence produces ~100 bogus "package does not exist" errors).
    compileOnly files(
            '../endlessleveling/build/classes/java/main',
            '../Endless-Leveling-Core/build/classes/java/main')
    // JSON parsing via Gson (bundled by Endless Leveling at runtime).
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

// Compatibility alias so ./gradlew package behaves like traditional packaging workflows.
tasks.register('package') {
    group = 'build'
    description = 'Builds the project and produces distributable artifacts.'
    dependsOn tasks.named('build')
}

// Centralized output: also copy produced jars into ../00_EndlessBuildOutputJars
// Untyped on purpose: a typed Copy task declares the shared jar-drop folder as its
// output, so Gradle fingerprints everything in it on every build (it held 9 GB once).
tasks.register('copyToEndlessJars') {
    dependsOn tasks.withType(Jar)
    doLast {
        // The drop zone is ONE jar per mod: the server loads every jar in it, so a build that
        // leaves the previous version behind gets both loaded and the older classes can win.
        // Prune our own older jars before staging (never touch any other mod's).
        def dropZone = file("${projectDir}/../00_EndlessBuildOutputJars")
        def staged = tasks.withType(Jar).findAll { it.enabled }.collect { it.archiveFile.get().asFile }
        def keep = staged.collect { it.name } as Set
        dropZone.listFiles({ f -> f.name ==~ /EndlessLevelingTemplate-.*\.jar/ && !keep.contains(f.name) } as FileFilter)
                ?.each { it.delete() }
        copy {
            from staged
            into dropZone
        }
    }
}
tasks.named('build') { finalizedBy 'copyToEndlessJars' }
